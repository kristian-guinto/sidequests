name: "nem-battery: Ingest Daily Dispatch"

# Runs once per day to ingest yesterday's full trading day (288 intervals).
#
# AEMO publishes Next_Day_Dispatch files at ~04:00 AEST (+10).
# This workflow runs at 19:00 UTC = 05:00 AEST (+10), safely after
# publication.  In daylight saving (AEDT +11) it runs at 06:00 local time.
#
# Required secret:  MOTHERDUCK_TOKEN  (MotherDuck service token)
#
# Manual trigger:   workflow_dispatch with optional `date` input for
#                   ad-hoc backfill of a specific day.

on:
  schedule:
    - cron: "0 19 * * *"    # 19:00 UTC = 05:00 AEST
  workflow_dispatch:
    inputs:
      date:
        description: "Trading day to ingest (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""

defaults:
  run:
    working-directory: nem-battery

jobs:
  ingest:
    name: Fetch and ingest full trading day
    runs-on: ubuntu-latest
    timeout-minutes: 10   # two large ZIPs (~13 MB total) + 288 inserts

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install package with pipeline extra
        run: uv sync --extra pipeline

      - name: Ingest trading day
        # If workflow_dispatch supplies a date, pass it; otherwise omit
        # the argument so the CLI defaults to yesterday.
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            uv run nem-battery ingest-daily "${{ github.event.inputs.date }}" --target remote
          else
            uv run nem-battery ingest-daily --target remote
          fi
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
