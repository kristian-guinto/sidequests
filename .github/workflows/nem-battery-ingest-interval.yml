name: "nem-battery: Ingest Dispatch Interval"

# Runs every 5 minutes to ingest the latest NEM dispatch interval.
#
# GitHub's cron scheduler has 1–10 min jitter under load.  This is
# acceptable because AEMO publishes new DispatchIS files every 5 minutes
# and the pipeline uses ON CONFLICT DO NOTHING — duplicate or missed
# runs leave the database consistent.
#
# Required secret:  MOTHERDUCK_TOKEN  (MotherDuck service token)

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # allow manual trigger for testing

defaults:
  run:
    working-directory: nem-battery

jobs:
  ingest:
    name: Fetch and ingest latest interval
    runs-on: ubuntu-latest
    timeout-minutes: 4    # must finish before the next 5-min window

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install package with pipeline extra
        run: uv sync --extra pipeline

      - name: Ingest latest dispatch interval
        run: uv run nem-battery ingest-interval --target remote
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
