[project]
name = "pipeline"
version = "0.1.0"
description = "OpenElectricity data ingestion and ETL pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "ducklembic",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[tool.uv.sources]
ducklembic = { workspace = true }

[project.scripts]
open-electricity = "pipeline.cli:app"
ingest = "pipeline.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

