[project]
name = "open-nem-ph"
version = "0.1.0"
description = "OpenNEM electricity market tracker & analytics pipeline for the Philippines (WESM/IEMOP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "supabase>=2.4.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.scripts]
open-nem-ph = "pipeline.ingest:app"
ingest = "pipeline.ingest:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
