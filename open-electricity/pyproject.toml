[project]
name = "open-electricity"
version = "0.1.0"
description = "OpenElectricity market tracker & analytics pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "duckdb>=1.1.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pytz>=2024.1",
    "rich>=13.7.1",
    "typer>=0.12.3",
]

[project.scripts]
open-electricity = "pipeline.ingest:app"
ingest = "pipeline.ingest:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]
