name: Daily OpenNEM-PH Ingestion Pipeline

on:
  schedule:
    # Runs daily at 01:00 UTC (09:00 AM Philippine Standard Time)
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Ingestion Mode (latest, backfill, sync-facilities, migrate)'
        required: true
        default: 'latest'
        type: choice
        options:
          - latest
          - backfill
          - sync-facilities
          - migrate
      start_date:
        description: 'Start Date for backfill (YYYY-MM-DD)'
        required: false
        default: ''
      end_date:
        description: 'End Date for backfill (YYYY-MM-DD)'
        required: false
        default: ''

jobs:
  ingest:
    name: Ingest IEMOP / WESM Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --frozen || uv sync

      - name: Run Daily Ingestion (Latest)
        if: "${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'latest') }}"
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'open_electricity_db' }}
        run: |
          uv run ingest latest --target motherduck --days 2

      - name: Run Manual Backfill
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'backfill' }}"
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'open_electricity_db' }}
        run: |
          uv run ingest backfill --target motherduck --start-date ${{ github.event.inputs.start_date }} --end-date ${{ github.event.inputs.end_date }}

      - name: Sync Facilities
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'sync-facilities' }}"
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'open_electricity_db' }}
        run: |
          uv run ingest sync-facilities --target motherduck

      - name: Migrate Database Schema (Ducklembic)
        if: "${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'migrate' }}"
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          MOTHERDUCK_DATABASE: ${{ secrets.MOTHERDUCK_DATABASE || 'open_electricity_db' }}
        run: |
          uv run ducklembic migrate --mode motherduck
